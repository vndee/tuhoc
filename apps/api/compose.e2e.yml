# Task 17: the E2E gate's own throwaway stack. Not used by any other task,
# not the deploy path (see docs/deploy.md for that) — this brings up
# exactly what `make test-e2e` needs to exercise the real API against a
# real Postgres, and nothing else.
#
# Ports are fixed (55433 / 8089) rather than left to compose's own dynamic
# allocation, on purpose: `apps/web/playwright.config.ts` and
# `scripts/test-e2e.sh` both need to know them ahead of time (the former to
# set `VITE_API_URL` for the dev server it boots, the latter to poll
# `/healthz` before handing off to Playwright), and hardcoding the same
# fixed pair in both places is simpler and more auditable than plumbing a
# discovered port through three tools. Both were checked free of any
# already-running service on this machine before being picked (see task
# report) — pass different `TUHOC_E2E_DB_PORT`/`TUHOC_E2E_API_PORT` env
# vars if either collides on yours.
#
# No named volume for `db`: every `make test-e2e` run starts from a
# genuinely empty database (schema applied fresh by the migrate step in
# scripts/test-e2e.sh) and `docker compose down -v` at teardown removes the
# anonymous volume compose still creates for the container's data
# directory, so nothing carries over between runs.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tuhoc
      POSTGRES_PASSWORD: tuhoc
      POSTGRES_DB: tuhoc
    ports:
      - '${TUHOC_E2E_DB_PORT:-55433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tuhoc -d tuhoc']
      interval: 2s
      timeout: 3s
      retries: 30

  # Task 18: the e2e stand-in for DeepSeek — see scripts/fake_deepseek.py's
  # own header comment for the full reasoning (a real DeepSeek call from an
  # e2e run costs real money and makes pass/fail depend on a third party's
  # uptime; this answers the exact wire shape apps/api/internal/ai/stream.go's
  # CompleteStream parses, with a FIXED reply and FIXED usage). Plain stdlib
  # Python, no image build of its own — the script is bind-mounted read-only
  # into an off-the-shelf `python:3.12-alpine`, the same "small HTTP server"
  # shape task-18-brief.md's Step 1 asks for, without a Dockerfile to keep in
  # sync.
  #
  # No `ports:` — deliberately NOT reachable from the host, unlike db/api.
  # Only the `api` service ever needs to talk to it, over this compose
  # project's own internal network (service-name DNS: `deepseek-fake`), and
  # that network is scoped PER COMPOSE PROJECT — scripts/test-e2e.sh already
  # gives every worktree its own project name (see that file's own comment
  # on `COMPOSE_PROJECT`), so two worktrees running `make test-e2e` at once
  # each get their own `deepseek-fake:8090`, never the same one. That is what
  # makes a `TUHOC_E2E_FAKE_DEEPSEEK_PORT`-shaped override (matching
  # DB_PORT/API_PORT/WEB_PORT below) unnecessary here: there is no host port
  # to collide on, and no shared container port to disambiguate.
  deepseek-fake:
    image: python:3.12-alpine
    volumes:
      - ../../scripts/fake_deepseek.py:/fake_deepseek.py:ro
    command: ['python3', '-u', '/fake_deepseek.py']
    healthcheck:
      test: ['CMD', 'python3', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    # `image:` names the tag the build is TAGGED AS — matching
    # docs/deploy.md's own `docker build -t tuhoc-api apps/api` (same tag,
    # same context, same Dockerfile), so the e2e stack and the documented
    # deploy build are never two different artifacts by accident.
    #
    # It is NOT a way to skip the build. `docker compose up` without
    # `--build` invokes `build:` only when this tag is absent locally, so
    # every run after the first silently reused a cached image and the
    # gate went blind to Go changes. `scripts/test-e2e.sh` therefore
    # always passes `--build` — see its header comment. Anything that
    # brings this stack up by hand must do the same:
    #   docker compose -f apps/api/compose.e2e.yml up -d --build
    image: tuhoc-api:latest
    build:
      # Build context is apps/api itself, matching the Dockerfile's own
      # header comment and docs/deploy.md's documented invocation
      # (`docker build -t tuhoc-api apps/api`) — this compose file lives
      # inside apps/api, so "." already resolves to the right context.
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      deepseek-fake:
        condition: service_healthy
    environment:
      PORT: '8080'
      DATABASE_URL: 'postgres://tuhoc:tuhoc@db:5432/tuhoc?sslmode=disable'
      # Task 18: points the real DeepSeek client (server.go's
      # ai.NewProviderClient wiring) at the fake provider above instead of
      # DeepSeek's real API — see docs/deploy.md's own Secrets table row for
      # DEEPSEEK_BASE_URL ("Only exists for pointing at a proxy or a test
      # double") and scripts/fake_deepseek.py's header comment for what it
      # answers. Service-name DNS, not localhost: this process runs INSIDE
      # the compose network, not on the host.
      DEEPSEEK_BASE_URL: 'http://deepseek-fake:8090'
      # Never checked by the fake server (it does not read the Authorization
      # header at all) and never billed anywhere — only needs to be
      # NON-EMPTY so this value reads as "a key is configured" rather than
      # accidentally exercising whatever an absent DEEPSEEK_API_KEY means
      # today. A literal, obviously-fake value, same posture as ADMIN_TOKEN
      # below: this stack is thrown away by `down -v` at the end of every
      # run, so there is nothing here worth protecting as a real secret.
      DEEPSEEK_API_KEY: 'e2e-fake-deepseek-key'
      # Must equal the origin the e2e web server actually runs on
      # (playwright.config.ts's PORT) — SameSite=Lax cookies require the
      # request's Origin to match what CORS allows, and the auth flow
      # will silently 401 on every post-login request otherwise. See
      # docs/deploy.md §0 for the full mechanism this mirrors locally.
      CORS_ORIGIN: 'http://localhost:${TUHOC_E2E_WEB_PORT:-5183}'
      # false: both sides are plain http://localhost in this local e2e
      # run. Never set this to false for a real deployment — see
      # docs/deploy.md.
      COOKIE_SECURE: 'false'
      # Task 16: gates PUT/DELETE /admin/courses/{slug} (internal/config's
      # AdminToken — see config.go). Without it the admin publish path is
      # switched off entirely, and scripts/test-e2e.sh's seed step (the
      # `curl -X PUT .../admin/courses/mau-hop-le` that puts a course in
      # front of the widget.spec.ts/p1.spec.ts suites) would 401 against a
      # fresh stack that never chose a token. A fixed literal, not a
      # generated secret: this stack is thrown away by `down -v` at the end
      # of every run (see this file's own header), so there is nothing here
      # worth rotating — only test-e2e.sh needs to know it, and it does.
      ADMIN_TOKEN: 'e2e-admin-token'
    ports:
      - '${TUHOC_E2E_API_PORT:-8089}:8080'
