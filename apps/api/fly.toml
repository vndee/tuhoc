# Fly.io app configuration for the tuhoc API (apps/api).
#
# This file lives next to the Dockerfile it builds
# (apps/api/Dockerfile) — run flyctl commands from apps/api/, e.g.:
#   cd apps/api && flyctl deploy
# or from the repo root, passing apps/api as the WORKING_DIRECTORY
# positional (this is what sets the Docker build context — NOT -c/--config,
# which only says which config file to read):
#   flyctl deploy apps/api -c apps/api/fly.toml
# [unverified — needs a live Fly account; `flyctl deploy --help` documents
# `deploy [WORKING_DIRECTORY]` as the build-context argument, and this repo
# has no way to exercise it end-to-end without deploying]. Do NOT run
# `flyctl deploy -c apps/api/fly.toml --dockerfile apps/api/Dockerfile` from
# the repo root: -c/--dockerfile only relocate which config/Dockerfile are
# read, not the build context, which stays the repo root (cwd) — the
# Dockerfile's `COPY go.mod go.sum ./` then fails, since go.mod/go.sum live
# in apps/api, not the repo root (the repo root only has go.work).
#
# Task 16 note on image architecture (see apps/api/Dockerfile's own header
# comment for the full explanation): `flyctl deploy` with no --local-only
# builds on Fly's own remote amd64 builders by default, which already
# targets the right platform for a shared-cpu-1x (amd64) machine — you do
# not need to pass --platform yourself in that path. The risk only shows up
# if you ever build locally and push instead
# (`flyctl deploy --local-only`, or a manual `docker build` + `flyctl
# deploy --image ...`): in that case you MUST run
#   docker build --platform linux/amd64 -t <tag> apps/api
# yourself first, or a plain build on an Apple Silicon machine ships an
# arm64 binary that dies with "exec format error" on Fly's amd64 hosts.
# docs/deploy.md's deploy steps use the remote-builder path specifically to
# sidestep this trap by default.

app = "tuhoc-api" # placeholder: Fly app names are globally unique across
                   # all Fly customers. `flyctl launch` (interactive) or
                   # `flyctl apps create <your-unique-name>` picks the real
                   # one — replace this before first deploy.
primary_region = "sin" # Singapore. Closest Fly region to Vietnam-based
                        # users; change to whatever region is actually
                        # closest to your audience (`flyctl platform
                        # regions` lists all of them).

[build]
  dockerfile = "Dockerfile"

# Plain (non-secret) runtime config — see .env.example for what each var
# means. DATABASE_URL is NOT here on purpose: it is a secret, set via
# `fly secrets set DATABASE_URL=...` (docs/deploy.md), and [env] values in
# fly.toml are committed to git, so no secret may live here.
#
# CORS_ORIGIN below is the exact origin the Cloudflare Pages site is served
# from (scheme + host, no trailing slash, no path) — see docs/deploy.md's
# cross-origin cookie analysis for why an exact origin (not a wildcard) is
# required here. The host is not arbitrary either: this API is deployed at
# api.duy.dev, so web and API are different ORIGINS but the same SITE
# (registrable domain duy.dev), which is what lets the session cookie's
# hardcoded SameSite=Lax survive the fetch. A host under a different
# registrable domain passes CORS and then 401s every authenticated call.
#
# AI (hệ thống con Pha 2) — HAI BÍ MẬT, KHÔNG ĐƯỢC ĐẶT Ở ĐÂY:
#
#   flyctl secrets set DEEPSEEK_API_KEY="..."   # key DeepSeek của NỀN TẢNG
#   flyctl secrets set BRAVE_API_KEY="..."      # chỉ bật tool web_search
#
# Chúng vắng khỏi tệp này cho tới vòng sửa sau review tổng nhánh Pha 2 (A3),
# và hậu quả không phải là một lỗi lúc deploy mà là sự IM LẶNG: `flyctl
# deploy` chạy sạch, `/healthz` xanh, rồi tính năng chủ lực chết đúng lúc
# một người học bấm "Hỏi". Để trống VẪN là trạng thái hợp lệ (AI suy giảm
# thành "chưa cấu hình", phần còn lại của ứng dụng chạy bình thường), nên
# hai dòng trên là một BƯỚC, không phải một điều kiện tiên quyết —
# server.go log một cảnh báo khởi động cho từng key còn thiếu.
#
# DEEPSEEK_BASE_URL cố tình KHÔNG có ở đây và cũng không phải secret:
# config.Load rơi về DefaultDeepSeekBaseURL khi nó trống, và viết một URL
# cứng vào tệp này là tạo một bản sao của hằng số Go ấy — thứ sẽ lệch lặng
# lẽ. Chỉ đặt (`flyctl secrets set` hoặc thêm vào [env]) khi thật sự trỏ tới
# một proxy hay một endpoint giả lập.
[env]
  PORT = "8080"
  CORS_ORIGIN = "https://tuhoc.duy.dev"
  COOKIE_SECURE = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 0 = allow the single machine to scale to zero when idle (this is what
  # makes the free allowance stretch). The cost is a cold start on the next
  # request — see docs/deploy.md's "free-tier realities" section for how
  # that interacts with Neon's own autosuspend and the API's 10s DB-connect
  # timeout.
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
