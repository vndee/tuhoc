# Render Blueprint for the tuhoc API (apps/api).
#
# Deploy: connect this repo in the Render dashboard as a Blueprint
# (New -> Blueprint), pointing at the repo root so this file is picked up
# automatically. See docs/deploy.md for the full first-deploy walkthrough.
#
# Why Docker instead of Render's native Go runtime: apps/api already ships
# a production Dockerfile (see apps/api/Dockerfile) built around a scratch
# base image and an embedded-migrations binary; reusing it here means the
# artifact that runs on Render is byte-for-byte the same build path used
# for Fly.io (apps/api/fly.toml) and local `docker build`, instead of a
# third, Render-specific build.
#
# Postgres: deliberately NOT declared under a top-level `databases:` block.
# Render's own free Postgres expires 30 days after creation (a real trap
# for a side project meant to run indefinitely) — this platform uses Neon's
# free tier instead (see docs/deploy.md), so DATABASE_URL below is a plain
# secret env var pointing at a Neon connection string, not a Render-managed
# database reference.
services:
  - type: web
    name: tuhoc-api
    runtime: docker
    plan: free
    region: singapore # closest Render region to Vietnam-based users;
                       # allowed values: oregon, ohio, virginia, frankfurt,
                       # singapore. Free-plan availability of non-US
                       # regions is unconfirmed (see docs/deploy.md §4a) —
                       # if Blueprint creation rejects "singapore" with a
                       # region-availability error, change this to
                       # "oregon" (Render's original/default region, the
                       # safest bet for zero-friction free-plan approval)
                       # and redeploy.
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      # CORS_ORIGIN is the exact origin the Cloudflare Pages site is served
      # from — scheme + host, no trailing slash, no path. It must be an exact
      # origin, never "*": the API sends AllowCredentials:true (see
      # apps/api/internal/server/server.go), and Fiber's CORS middleware
      # refuses to combine a wildcard origin with credentials.
      #
      # This value is no longer a placeholder, and the host it names is not
      # arbitrary. The API is deployed at api.duy.dev, so the two are
      # different ORIGINS but the same SITE (registrable domain duy.dev).
      # That is what lets the session cookie's hardcoded SameSite=Lax reach
      # the API on ordinary fetch/XHR calls — see docs/deploy.md §0 and
      # apps/api/internal/auth/csrf_samesite_test.go. Pointing this at a
      # host under a DIFFERENT registrable domain (a *.pages.dev default
      # hostname, say) makes CORS pass and every authenticated request 401,
      # because the browser stops attaching the cookie.
      - key: CORS_ORIGIN
        value: https://tuhoc.duy.dev
      - key: COOKIE_SECURE
        value: "true"
      # DATABASE_URL is a secret: `sync: false` means Render prompts for
      # the value once (Blueprint creation, or Environment tab afterward)
      # and never reads it back from this file — it is never committed.
      # Paste in the Neon pooled connection string (see docs/deploy.md).
      - key: DATABASE_URL
        sync: false
      # GITHUB_TOKEN is a read-only, fine-grained PAT scoped to the registry
      # repository's Discussions, used to embed those threads on course
      # pages. It belongs to the PLATFORM, not to any reader.
      #
      # This comment used to add "It is NOT an exception to the promise that
      # a reader's AI provider key never touches this server". That promise
      # died at Task 11: the AI agent now runs on this server against ONE
      # DeepSeek account the platform pays for (DEEPSEEK_API_KEY, below), so
      # there is no longer a no-provider-key rule for this token to be an
      # exception to. What survives, and is the reason the distinction was
      # ever drawn, is narrower and still true: this server never accepts a
      # THIRD PARTY'S key from a request — enforced by
      # apps/api/internal/server/provider_key_never_leaks_test.go's
      # TestNoRequestStructAcceptsAKey. See config.go's own comment on this
      # field, and .env.example, for how the platform's own secrets differ
      # from a reader's.
      #
      # `sync: false` for the same reason as DATABASE_URL: Render prompts
      # once and never reads it back from this file.
      #
      # Leaving it unset is a supported state, not a broken one: the
      # discussions section degrades to "could not load" and every other
      # part of the app is unaffected. That is the correct configuration
      # until a public registry repository exists (docs/deploy.md §5c).
      - key: GITHUB_TOKEN
        sync: false
      # Not a secret — it names a public repository. "owner/name".
      - key: GITHUB_DISCUSSIONS_REPO
        value: ""
      # ADMIN_TOKEN gates the admin publish API (PUT/DELETE
      # /admin/courses/{slug} and friends — see
      # apps/api/internal/config/config.go's own comment on this field).
      # This is the operator credential that lets `tuhoc-cli publish` (or
      # any `curl -H "Authorization: Bearer <token>"`) publish a course
      # without a logged-in admin session — the OTHER door onto the same
      # endpoints, opened by a real user account with `users.role='admin'`
      # (see docs/deploy.md's "First admin" section for how to set that).
      #
      # `sync: false` for the same reason as DATABASE_URL/GITHUB_TOKEN:
      # Render prompts once (Blueprint creation, or the Environment tab
      # afterward) and never reads it back from this file. Generate a real
      # secret before the first deploy, e.g. `openssl rand -hex 32` —
      # never the literal fixture value `apps/api/compose.e2e.yml` uses for
      # its own throwaway e2e stack.
      #
      # Leaving it unset is a supported state, not a broken one, and BOTH
      # doors fail closed when it is: `config.Load` reads no default, and
      # `adminTokenMatches` special-cases an empty configured token to
      # "never matches" (an unset token cannot be defeated by an empty
      # supplied one) — so the CLI-token door simply stays shut until an
      # operator chooses a value here. This was previously undocumented
      # anywhere a fresh deploy would see it (final whole-branch review,
      # Important 1) — it must never be set to an empty string on purpose
      # to "disable" the door; leave the key entirely absent instead, which
      # is what an unconfigured Blueprint already does before this value is
      # filled in.
      - key: ADMIN_TOKEN
        sync: false
      # --- AI (hệ thống con Pha 2) ------------------------------------
      #
      # BA BIẾN NÀY VẮNG MẶT KHỎI TỆP NÀY CHO TỚI VÒNG SỬA SAU REVIEW TỔNG
      # NHÁNH PHA 2 (mục A3), và cái giá của việc ấy là im lặng tuyệt đối:
      # `sync: false` LÀ dòng khiến Render HỎI một giá trị lúc tạo
      # Blueprint. Không có dòng ấy thì Render không hỏi, người vận hành
      # không có gì để điền, và API khởi động sạch sẽ rồi chết đúng lúc một
      # người học bấm "Hỏi" — với một câu báo lỗi nói rằng NHÀ CUNG CẤP
      # trục trặc, không phải rằng key chưa được đặt.
      #
      # (server.go nay cũng log một dòng cảnh báo lúc khởi động khi thiếu
      # key — nhưng một dòng log chỉ giúp người đã đi tìm; dòng `sync: false`
      # dưới đây là thứ hỏi TRƯỚC khi có gì để đi tìm.)
      #
      # DEEPSEEK_API_KEY: key của NỀN TẢNG, không phải của người học (lời
      # hứa "key của người đọc không bao giờ chạm máy chủ này" đã được thay
      # bằng kiến trúc mới ở Task 11 — xem .env.example cho ba điểm khác
      # nhau). Để trống là trạng thái HỢP LỆ: tính năng AI suy giảm thành
      # "chưa cấu hình", mọi phần còn lại của ứng dụng không bị ảnh hưởng.
      - key: DEEPSEEK_API_KEY
        sync: false
      # BRAVE_API_KEY: chỉ bật riêng tool web_search. Để trống thì agent vẫn
      # trả lời được bằng các tool khác.
      - key: BRAVE_API_KEY
        sync: false
      # DEEPSEEK_BASE_URL KHÔNG phải bí mật, và ĐỂ TRỐNG là đúng cho mọi
      # triển khai bình thường: config.Load rơi về DefaultDeepSeekBaseURL
      # (apps/api/internal/config/config.go). Khai ở đây với value rỗng —
      # cùng hình dạng GITHUB_DISCUSSIONS_REPO ở trên — để biến này HIỆN
      # trong Environment tab cho ai cần trỏ sang một proxy hay một endpoint
      # giả lập, chứ KHÔNG ghim một URL cứng vào tệp này: ghim tức là tạo
      # một bản sao của hằng số Go, và bản sao ấy sẽ lệch lặng lẽ.
      - key: DEEPSEEK_BASE_URL
        value: ""
