# Registry CI — a pre-merge convenience check, not the platform's safety net.
#
# ## What changed under the 2026-08-25 server-side pivot (task 17)
#
# This file's original header said the server "does NOT run the HTML rule set"
# and delegates that job to this workflow. That is no longer true, and the file
# it cited (`apps/api/internal/course/usecase.go`) no longer exists.
# `apps/api/internal/catalog/usecase.go`'s `publishZip` now runs
# `pkgcheck.Validate` — the same rule set, in Go — on every publish AND every
# rollback, unconditionally, regardless of which door the zip came through
# (`tuhoc publish` or the admin CMS). The spec says it plainly: *"cổng thật giờ
# nằm ở server"* — the real gate is the server now, not this job. See
# `tools/registry/src/validate-pr.ts`'s own header for the full account.
#
# What this job still buys: catching a bad package **before** it is merged
# into whatever repo the community sends PRs into, rather than after a
# maintainer has already tried to publish it and been handed a 400. Genuinely
# useful, just smaller than it used to be.
#
# The `publish` job that used to live here — generating `index.json` and a
# `.zip` per version, served over GitHub Pages — is GONE. It existed because
# the community registry WAS the catalog; the catalog is now `/courses`, served
# from Postgres by `apps/api`, and nothing pulls a package from a
# registry-hosted archive any more. Publishing either artifact now would be
# publishing a catalog nobody reads.
#
# ## Everything decidable lives in TypeScript, on purpose
#
# GitHub Actions cannot be run locally, so any logic written in these `run:`
# blocks is logic nobody can test. The rule is therefore: this file does three
# things a YAML file can be trusted with — check out, install, and invoke — and
# every decision is inside `tools/registry/`, where `bun run test` covers it.
# The only shell logic here is the `git diff` that produces the changed-file
# list, and the tool goes RED rather than green if that list is empty (see
# `validate-pr.ts`, anti-blind-gate check #2).
#
# ## The blind-gate rule this repo has five recorded violations of
#
# *A gate measures what it can reach and goes quiet exactly where it cannot.*
# Both quiet spots are wired to fail loudly instead:
#
#   1. registry root unreadable / holding no course → red on EVERY run,
#      including PRs that touch no course (`courseDirsUnder` throws);
#   2. an empty changed-file list → red, because a pull request always changes
#      at least one file and an empty diff means the plumbing failed.
#
# A PR that genuinely touches no course is a SKIP that prints its reason, the
# root it looked under, and the files it did see. It is not a green "validated".
#
# ## Not yet run on real GitHub Actions
#
# Written and exercised locally through `make test-registry`; the runner-shaped
# parts (checkout depth, `oven-sh/setup-bun`) have never executed on a hosted
# runner. Treat the first real run as the test of those.

name: registry

on:
  pull_request:
  push:
    branches: [main]

# The registry root: one directory per course.
#
# `fixtures/registry/` — NOT `fixtures/courses/`, on purpose. `fixtures/courses/`
# now holds real, load-bearing test data for a dozen unrelated test files across
# the repo (`fixtures/README.md`), including one package (`so-dau-phay-dong`)
# that is deliberately, permanently invalid under format v2 until it is
# rewritten as a widget — content work outside this workflow's scope. Pointing
# this job at that root would make it permanently red for a reason it cannot
# fix. `fixtures/registry/` is this workflow's own small, valid v2 fixture,
# decoupled from that. It is written ONCE, here, so relocating the tree is one
# edit and not a hunt.
env:
  REGISTRY_ROOT: fixtures/registry

# Least privilege: this is the only job in the file now, and it only reads.
permissions:
  contents: read

jobs:
  validate:
    name: bộ luật course-format trên các course PR đổi
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` is load-bearing: the changed-file diff needs the merge
      # base, which a depth-1 checkout does not have. The default depth of 1
      # would make that silently wrong (an empty diff) rather than loud — and
      # `validate-pr.ts` treats an empty diff as red, not "nothing to do".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No npm workspaces and no root package.json in this repo (ruling S1-F1),
      # so every package installs its own. `course-format` is installed because
      # `tools/registry` imports its sources, which import `parse5` and `fflate`
      # — Node resolution finds those from the importing file's own directory.
      - name: cài phụ thuộc
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --cwd packages/course-format
          bun install --frozen-lockfile --cwd tools/registry

      # `tsc -b`, never `tsc --noEmit`: `--noEmit` does not descend into project
      # references and has already produced one empty, always-green gate in this
      # repo (docs/carried-forward.md §2).
      - name: typecheck
        shell: bash
        run: |
          set -euo pipefail
          bun run --cwd tools/registry typecheck

      # These are the tests that assert the load-bearing claim: a `content`-tier
      # package carrying `<script>` is REFUSED and the message names the file,
      # and the same bytes declared `interactive` are ACCEPTED. Without the
      # second, a validator that refused everything would also be green.
      - name: test tools/registry
        shell: bash
        run: |
          set -euo pipefail
          bun run --cwd tools/registry test

      # The only shell logic in this file. Three-dot diff = what this branch
      # changed since the merge base, which is what a reviewer is looking at.
      #
      # The base branch is fetched EXPLICITLY rather than assuming
      # `origin/<base>` is a remote-tracking ref the checkout happened to leave
      # behind: that assumption is exactly the kind that produces an empty diff
      # and a green tick. It cannot produce one here — an empty list is red in
      # `validate-pr.ts` — but a red job with a clear cause beats a red job with
      # a confusing one.
      - name: liệt kê tệp PR đổi
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_REF}"
          git diff --name-only FETCH_HEAD...HEAD > "${RUNNER_TEMP}/changed.txt"
          echo "PR đổi $(wc -l < "${RUNNER_TEMP}/changed.txt") tệp"

      # PR: only the courses the PR touched. An empty changed-file list is RED
      # here, not "nothing to do" — see validate-pr.ts.
      - name: kiểm course PR đổi
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          bun tools/registry/src/validate-pr.ts --root "${REGISTRY_ROOT}" --changed-from "${RUNNER_TEMP}/changed.txt"

      # push to main: the whole tree, every time. `fixtures/registry/` is small
      # and rarely touched, so this mostly proves the CLI's success path stays
      # wired end-to-end — but a rule tightening in `packages/course-format`
      # would still show up here, on this fixture, before anyone notices it
      # rejecting a real submission elsewhere.
      - name: kiểm TOÀN BỘ registry
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          bun tools/registry/src/validate-pr.ts --root "${REGISTRY_ROOT}"

# There is no `publish` job any more. It used to generate `index.json` and a
# per-version `.zip` archive and deploy both to GitHub Pages — the community
# registry WAS the catalog, so publishing it here was the only publish step
# that existed. Task 17 of the 2026-08-25 server-side pivot removed it: the
# catalog is `/courses`, served from Postgres by `apps/api`, and publishing
# happens through `PUT /admin/courses/:slug` (`tuhoc publish` or the admin
# CMS), never through this workflow. See this file's header and
# `tools/registry/src/validate-pr.ts`'s for the full account.
